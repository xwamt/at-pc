# at-pc-agent 终端配置文件 (v1.1.0)
# 请将此配置文件与 at-pc-agent (或 at-pc-agent.exe) 放置在同一目录下。
# 示例默认仅连接本机网关；局域网或远程部署请在 GUI 或此处显式指定受信任的 Server 地址。

# 具身操作安全准入开关：默认 false，禁止远程鼠标键盘注入。
# 可通过 --enable-computer-use 或 AT_PC_ENABLE_COMPUTER_USE=1 显式开启。
enable_computer_use = false

[server]
# 中心服务端 WebSocket 连接地址。
# 生产环境请使用受信任的 WSS 地址，例如 wss://<server-host>:9801/ws。
url = "ws://127.0.0.1:9801/ws"

# [LEGACY] 设备/共享 Token 配置仅用于旧版本兼容，当前注册路径尚未在服务端强制校验。
# 请勿把它当作设备身份或授权边界；后续 Pending Enrollment + mTLS 流程将替代它。
# device_token = "atpc_dv_<id>_<secret>"
# auth_token = "<legacy-shared-token>"

# 固定自动重连间隔（秒）；修改服务器地址或用户手动重连可立即唤醒一次尝试。
reconnect_interval_secs = 5

# TLS / WSS 安全连接配置（可选）
# insecure_skip_verify = false  # 仅隔离测试可设 true 跳过证书校验
# ca_cert_path = "server.crt"   # 自定义 CA 证书路径（PEM）
# client_cert_path = "client.crt" # mTLS 客户端证书路径（PEM）
# client_key_path = "client.key"  # mTLS 客户端私钥路径（PEM）

[device]
# 终端唯一标识：默认为 "auto"（自动组合计算机名和 MAC 地址后缀）。
# 也可手动指定固定标识，例如 "finance-pc-01"。
device_id = "auto"

# 终端友好显示名称（留空时自动读取计算机名）。
device_name = ""
