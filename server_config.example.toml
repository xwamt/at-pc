# at-pc-server 服务端配置文件示例 (v1.1.0)
# 启动时可通过 --config server_config.toml 加载。
# 此文件采用安全默认值：仅监听回环地址且不允许明文远程传输。

# 仅本地访问；要对外提供服务，请显式改为受控监听地址并配置 TLS。
listen_host = "127.0.0.1"

# 非回环监听且未配置 TLS 时保持 false；仅隔离测试可显式改为 true。
allow_plaintext = false

# WebSocket 终端通信端口与路径。
ws_port = 9801
ws_path = "/ws"

# MCP HTTP/SSE 网关及 Web 管理控制台监听端口。
mcp_port = 9800

# [LEGACY] 明文 auth_token 已弃用；应使用首次启动生成的操作端 API Key。
# auth_token = "<legacy-shared-token>"

# CORS 跨域允许来源白名单（为空时仅允许基础同源与内置 Dashboard）。
# allowed_origins = ["https://ops.example.com"]

# 心跳与离线超时配置（秒）。
heartbeat_interval_secs = 5
offline_threshold_secs = 15
sweep_interval_secs = 5

# 终端元数据与服务端追加审计 JSONL 的本地存储路径。
meta_store_path = "terminals_meta.json"
audit_log_path = "audit.jsonl"

# [LEGACY] 基于角色的明文 Token 映射已弃用；KeyStore 激活后会拒绝此配置。
# [roles]
# "viewer-token" = "viewer"

# TLS / HTTPS / WSS 传输层加密配置：对外部署必须配置证书。
# tls_cert_path = "server.crt"
# tls_key_path = "server.key"
# tls_client_ca_path = "ca.crt" # 现有 mTLS 客户端证书校验
