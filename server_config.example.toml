# at-pc-server 服务端配置文件示例 (v1.0.0)
# 启动时可通过 --config server_config.toml 加载

# 监听 IP 地址：默认为 "127.0.0.1" (安全回环)，如需局域网或远程访问请设为 "0.0.0.0"
listen_host = "127.0.0.1"

# WebSocket 终端通信端口与路径
ws_port = 9801
ws_path = "/ws"

# MCP HTTP/SSE 网关及 Web 管理控制台监听端口
mcp_port = 9800

# 全局默认连接鉴权 Token (留空则不开启默认 Token 验证)
# auth_token = "admin-secret-token"

# CORS 跨域允许来源白名单 (为空时仅允许基础同源与内置 Dashboard)
# allowed_origins = ["http://localhost:3000", "https://ops.example.com"]

# 心跳与离线超时配置 (秒)
heartbeat_interval_secs = 5
offline_threshold_secs = 15
sweep_interval_secs = 5

# 终端元数据本地持久化文件路径 (保存自定义设备名称、备注与标签)
meta_store_path = "terminals_meta.json"

# 操作审计日志落盘路径 (不可篡改 JSONL 格式流水)
audit_log_path = "audit.jsonl"

# 基于角色的访问控制 (RBAC) Token 映射
# 支持三种角色级别：viewer (只读诊断), operator (运维排障), admin (完全控制/命令执行/具身操作)
[roles]
# "viewer-token-123" = "viewer"
# "operator-token-456" = "operator"
# "admin-token-789" = "admin"

# TLS / HTTPS / WSS 传输层加密配置 (可选)
# tls_cert_path = "server.crt"
# tls_key_path = "server.key"
# tls_client_ca_path = "ca.crt" # 开启客户端双向认证 (mTLS) 时配置
