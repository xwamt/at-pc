[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.dependencies]
at-pc-protocol = { path = "crates/protocol" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
local-ip-address = "0.6"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27"
base64 = "0.22"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
ring = "0.17"
toml = "1.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rust-embed = { version = "8.5", features = ["axum"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.1"
rustls-pki-types = "1.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls"] }
rcgen = "0.13"
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
