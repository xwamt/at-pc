  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-backdrop" style="display: none; z-index: 10000;">
    <div class="modal" style="max-width: 440px;">
      <div class="modal-header">
        <h3 style="font-size: 15px; font-weight: 700; color: #fff;">🔐 访问凭据认证</h3>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">服务端已开启鉴权保护，请输入 API Key 以获取终端拓扑与执行控制操作：</p>
        <input type="password" id="authTokenInput" class="form-input" placeholder="输入 API Key" style="width: 100%; padding: 10px 12px; font-size: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); color: #fff; border-radius: 6px; outline: none;" onkeydown="if(event.key==='Enter') submitAuthToken()">
        <div id="authErrorMsg" style="color: var(--danger); font-size: 12px; margin-top: 8px; display: none;">认证失败：API Key 无效或已过期</div>
      </div>
      <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-primary btn-sm" onclick="submitAuthToken()">确认验证</button>
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div id="resultModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 15px; font-weight: 700; color: #fff;">诊断结果</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent">
        <pre>加载中...</pre>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">关闭窗口</button>
      </div>
    </div>
  </div>
</body>
</html>
