e:12px}.key-btn{padding:3px 8px;font-size:11px;border-radius:5px;background:#1e293be6;border:1px solid rgba(255,255,255,.1);color:#e2e8f0;cursor:pointer;transition:all .12s}.key-btn:hover{background:var(--primary);color:#0b0f19;font-weight:600}.cursor-tool-btn,.scale-tool-btn{padding:3px 8px;font-size:11px;border-radius:5px;background:#1e293bd9;border:1px solid rgba(255,255,255,.08);color:#cbd5e1;cursor:pointer;transition:all .12s;white-space:nowrap}.cursor-tool-btn:hover,.scale-tool-btn:hover{background:#334155f2;color:#fff}.cursor-tool-btn.active,.scale-tool-btn.active{background:var(--primary);color:#0b0f19;font-weight:700;border-color:var(--primary)}.empty-state{grid-column:1 / -1;padding:60px 20px;text-align:center;color:var(--text-muted);background:var(--card-bg);border-radius:12px;border:1px dashed var(--card-border)}.rd-main-wrapper{display:flex;flex-direction:column;width:100%;position:relative}.rd-canvas-container{position:relative;width:100%;height:72vh;min-height:500px;background:#050811;border-radius:8px;overflow:hidden;display:flex;justify-content:center;align-items:center;border:1px solid var(--card-border)}.rd-canvas{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;cursor:default;outline:none;display:block}#rdMainWrapper:fullscreen{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;background:#050811!important;border-radius:0!important;border:none!important;padding:0!important;margin:0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;position:fixed!important;inset:0!important;z-index:99999!important}#rdMainWrapper:fullscreen .rd-hud{position:absolute!important;top:12px!important;left:50%!important;transform:translate(-50%)!important;z-index:100000!important;max-width:96vw!important;background:#0b0f19eb!important;-webkit-backdrop-filter:blur(16px)!important;backdrop-filter:blur(16px)!important;border:1px solid rgba(56,189,248,.3)!important;box-shadow:0 10px 30px #000000bf!important;opacity:.95;transition:opacity .2s ease}#rdMainWrapper:fullscreen .rd-hud:hover{opacity:1!important}#rdMainWrapper:fullscreen .rd-canvas-container{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;border-radius:0!important;border:none!important}#rdMainWrapper:fullscreen .rd-canvas{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important}#rdMainWrapper:fullscreen .rd-bottom-bar{display:none!important}.keys-panel{display:flex;flex-direction:column;gap:14px}.keys-panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--card-border);gap:12px;flex-wrap:wrap}.keys-table{width:100%;border-collapse:collapse;font-size:12px}.keys-table th{background:#080c14;color:var(--text-muted);font-weight:600;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:2}.keys-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}.keys-table tr:hover td{background:#38bdf80a}.key-prefix{font-family:ui-monospace,monospace;color:var(--primary);font-size:11.5px;background:#38bdf814;padding:2px 6px;border-radius:4px;border:1px solid rgba(56,189,248,.2)}.tag-kind{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}.tag-kind-sk{background:#38bdf81f;color:#38bdf8;border:1px solid rgba(56,189,248,.25)}.tag-kind-dv{background:#a855f71f;color:#c084fc;border:1px solid rgba(168,85,247,.25)}.tag-role{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}.tag-role-admin{background:#f43f5e26;color:#fb7185;border:1px solid rgba(244,63,94,.3)}.tag-role-operator{background:#3b82f626;color:#60a5fa;border:1px solid rgba(59,130,246,.3)}.tag-role-viewer{background:#94a3b81f;color:#94a3b8;border:1px solid rgba(148,163,184,.25)}.tag-scope{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10.5px;background:#ffffff0d;color:#cbd5e1;border:1px solid rgba(255,255,255,.08);font-family:ui-monospace,monospace}.warning-banner{background:#f59e0b1a;border:1px solid rgba(245,158,11,.35);border-radius:8px;padding:12px 14px;color:#fbbf24;font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-area">
        <div class="logo-box">
          <div class="logo-inner">PC</div>
        </div>
        <div class="title-box">
          <h1>
            <span>AT-PC 集中管控平台</span>
            <span class="version-tag">Obsidian v1.0.0</span>
          </h1>
          <p>Multi-Terminal MCP Remote Gateway & Dynamic Fleet Hub</p>
        </div>
      </div>
      <div class="status-tags">
        <div class="tag"><div class="dot pulse"></div> <span>网关就绪</span></div>
        <div class="tag">WS: <b style="color: #38bdf8;">9801</b></div>
        <div class="tag">MCP: <b style="color: #38bdf8;">9800</b></div>
        <button id="runningCallsBtn" class="btn btn-secondary btn-sm" onclick="showRunningCallsModal()" style="display: none; align-items: center; gap: 6px; color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.1);">
          <span class="dot pulse" style="background: #f59e0b; box-shadow: 0 0 8px #f59e0b;"></span>
          <span>⚡ 运行中任务 (<b id="runningCallsCount">0</b>)</span>
        </button>
        <button id="keysBtn" class="btn btn-secondary btn-sm" onclick="showKeysModal()" style="display: none; align-items: center; gap: 6px;">
          <span>🔑 API 密钥</span>
        </button>
        <button id="mcpConfigBtn" class="btn btn-secondary btn-sm" onclick="showMcpConfigModal()">📋 复制 MCP 配置</button>
      </div>
    </header>

    <!-- Toolbar & Filter Tabs -->
    <div class="toolbar">
      <div class="search-wrap">
        <div class="search-box">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" id="searchInput" placeholder="快速检索主机名、局域网 IP、终端 ID、系统版本..." oninput="renderCards()">
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="setFilterTab('all', this)">全部</button>
          <button class="filter-tab" onclick="setFilterTab('online', this)">🟢 在线</button>
          <button class="filter-tab" onclick="setFilterTab('warn', this)">⚠️ 高负载</button>
          <button class="filter-tab" onclick="setFilterTab('offline', this)">⚪ 离线</button>
        </div>
      </div>
      
      <div class="meta-summary">
        <span>在线终端: <b id="onlineCount" style="color: var(--success); font-size: 15px;">0</b> / 总计: <span id="totalCount">0</span></span>
        <button class="btn btn-secondary btn-sm" onclick="fetchTerminals()" title="立即同步设备状态">🔄 刷新</button>
      </div>
    </div>

    <!-- Terminal Cards Grid -->
    <div id="terminalGrid" class="grid">
      <div class="empty-state">
        <h3>正在加载终端列表...</h3>
        <p style="margin-top: 8px; font-size: 13px;">请稍候，系统正在从服务端获取在线设备</p>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-backdrop" style="display: none; z-index: 10000;">
    <div class="modal" style="max-width: 440px;">
      <div class="modal-header">
        <h3 style="font-size: 15px; font-weight: 700; color: #fff;">🔐 访问凭据认证</h3>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">服务端已开启鉴权保护，请输入 API Key 以获取终端拓扑与执行控制操作：</p>
        <input type="password" id="authTokenInput" class="form-input" placeholder="输入 API Key" style="width: 100%; padding: 10px 12px; font-size: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); color: #fff; border-radius: 6px; outline: none;" onkeydown="if(event.key==='Enter') submitAuthToken()">
        <div id="authErrorMsg" style="color: var(--danger); font-size: 12px; margin-top: 8px; display: none;">认证失败：API Key 无效或已过期</div>
      </div>
      <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-primary btn-sm" onclick="submitAuthToken()">确认验证</button>
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div id="resultModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 15px; font-weight: 700; color: #fff;">诊断结果</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent">
        <pre>加载中...</pre>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">关闭窗口</button>
      </div>
    </div>
  </div>
</body>
</html>
