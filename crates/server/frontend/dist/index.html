      </div>
      
      <div class="meta-summary">
        <span>在线终端: <b id="onlineCount" style="color: var(--success); font-size: 15px;">0</b> / 总计: <span id="totalCount">0</span></span>
        <button class="btn btn-secondary btn-sm" onclick="fetchTerminals()" title="立即同步设备状态">🔄 刷新</button>
      </div>
    </div>

    <!-- Terminal Cards Grid -->
    <div id="terminalGrid" class="grid">
      <div class="empty-state">
        <h3>正在加载终端列表...</h3>
        <p style="margin-top: 8px; font-size: 13px;">请稍候，系统正在从服务端获取在线设备</p>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-backdrop" style="display: none; z-index: 10000;">
    <div class="modal" style="max-width: 440px;">
      <div class="modal-header">
        <h3 style="font-size: 15px; font-weight: 700; color: #fff;">🔐 访问凭据认证</h3>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">服务端已开启鉴权保护，请输入访问令牌 (Token) 以获取终端拓扑与执行控制操作：</p>
        <input type="password" id="authTokenInput" class="form-input" placeholder="输入访问 Token / PIN" style="width: 100%; padding: 10px 12px; font-size: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); color: #fff; border-radius: 6px; outline: none;" onkeydown="if(event.key==='Enter') submitAuthToken()">
        <div id="authErrorMsg" style="color: var(--danger); font-size: 12px; margin-top: 8px; display: none;">认证失败：Token 无效或已过期</div>
      </div>
      <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-primary btn-sm" onclick="submitAuthToken()">确认验证</button>
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div id="resultModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 15px; font-weight: 700; color: #fff;">诊断结果</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent">
        <pre>加载中...</pre>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">关闭窗口</button>
      </div>
    </div>
  </div>
</body>
</html>
